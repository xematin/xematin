<!doctype html>
<meta charset="utf-8">
<title>profile preview</title>
<!--
  Local preview. Serve the repository root and open this file:
      python -m http.server 8777
      http://127.0.0.1:8777/preview.html
  The panels are loaded as <img>, which is exactly how GitHub renders them, so what you
  see here is what the profile will look like.
-->
<style>
  :root { color-scheme: dark }
  html, body { background: #0d1117; margin: 0 }
  body { padding: 24px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace }
  .w { max-width: 1012px; margin: 0 auto }
  img { display: block; border-radius: 6px; width: 100% }
  .row { text-align: center; padding: 14px 0 }
  .row img { display: inline-block; width: auto; height: 40px; margin: 0 4px }
  p { color: #7d8590; font-size: 12px; text-align: center; margin: 14px 0 }
  a { color: #58a6ff }
</style>
<div class="w">
  <img src="assets/hero.svg" alt="hero">
  <div class="row">
    <a href="#"><img src="assets/link-website.svg" alt="website"></a>
    <a href="#"><img src="assets/link-projects.svg" alt="projects"></a>
    <a href="#"><img src="assets/link-gists.svg" alt="gists"></a>
  </div>
  <p>Backend and automation engineer. I build Django services, Telegram bots and the Linux plumbing that keeps them running.</p>
  <img src="assets/stack.svg" alt="stack">
  <p></p>
  <img src="assets/module-01.svg" alt="module 01">
  <p></p>
  <img src="assets/module-02.svg" alt="module 02">
  <p></p>
  <img src="assets/module-03.svg" alt="module 03">
  <p></p>
  <img src="assets/signal.svg" alt="signal">
</div>
